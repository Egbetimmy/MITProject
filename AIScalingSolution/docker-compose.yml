services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aiscaling-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2G

  userservice:
    build:
      context: .
      dockerfile: UserService/Api/Dockerfile
    container_name: userservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=UserDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      DOTNET_ROLL_FORWARD: Major
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  productservice:
    build:
      context: .
      dockerfile: ProductService/Api/Dockerfile
    container_name: productservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ProductDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      DOTNET_ROLL_FORWARD: Major
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  orderservice:
    build:
      context: .
      dockerfile: OrderService/Api/Dockerfile
    container_name: orderservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      DOTNET_ROLL_FORWARD: Major
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  monitoringservice:
    build:
      context: .
      dockerfile: MonitoringService/Api/Dockerfile
    container_name: monitoringservice
    depends_on:
      sqlserver:
        condition: service_healthy
      userservice:
        condition: service_started
      productservice:
        condition: service_started
      orderservice:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MonitoringDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      DOTNET_ROLL_FORWARD: Major
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  predictionservice:
    build:
      context: .
      dockerfile: PredictionService/Api/Dockerfile
    container_name: predictionservice
    depends_on:
      sqlserver:
        condition: service_healthy
      monitoringservice:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MonitoringConnection: "Server=sqlserver;Database=MonitoringDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      MlNet__ModelPath: "/app/models/model.zip"
      DOTNET_ROLL_FORWARD: Major
    volumes:
      - ml-models:/app/models
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: aiscaling-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: apigateway
    ports:
      - "5000:8080"
    depends_on:
      redis:
        condition: service_healthy
      userservice:
        condition: service_started
      productservice:
        condition: service_started
      orderservice:
        condition: service_started
      monitoringservice:
        condition: service_started
      predictionservice:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PredictiveMiddleware__Redis__ConnectionString: redis:6379
      PredictiveMiddleware__Diagnostics__IntervalSeconds: 2
      GatewayIntelligence__MonitoringBaseUrl: http://monitoringservice:8080
      GatewayIntelligence__PredictionBaseUrl: http://predictionservice:8080
      DOTNET_ROLL_FORWARD: Major
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  sqlserver-data:
  ml-models:
